# Builds the ScryPad Windows installer (.exe and .msi) for itch.io and GitHub.
# Runs when: you press "Run workflow" on the Actions tab, you push a tag like v0.1.0
# (that also makes a draft GitHub Release with the installers), or a commit message
# includes [build]. Windows builds use extra Actions minutes, so it doesn't run on every push.
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ScryPad-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScryPad-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScryPad-Windows-Portable
          path: src-tauri/target/release/scrypad.exe
          if-no-files-found: error
      - name: Draft a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
