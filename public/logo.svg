<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48e0d2"/>
      <stop offset="50%" stop-color="#5cff9d"/>
      <stop offset="100%" stop-color="#48e0d2"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Bracket < -->
  <path d="M 16 11 L 5 20 L 16 29" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
  
  <!-- Right Bracket > -->
  <path d="M 36 11 L 47 20 L 36 29" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

  <!-- Upper Arch -->
  <path d="M 9 20 C 14 10, 38 10, 43 20" stroke="#48e0d2" stroke-width="1.8" stroke-linecap="round" filter="url(#logoGlow)"/>
  <!-- Lower Arch -->
  <path d="M 9 20 C 14 30, 38 30, 43 20" stroke="#48e0d2" stroke-width="1.8" stroke-linecap="round" filter="url(#logoGlow)"/>

  <!-- Pupil Diamond Spark ✦ -->
  <path d="M 26 14 C 26 18, 28 20, 32 20 C 28 20, 26 22, 26 26 C 26 22, 24 20, 20 20 C 24 20, 26 18, 26 14 Z" fill="#5cff9d" filter="url(#logoGlow)"/>
</svg>
