<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36" width="64" height="36" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48e0d2"/>
      <stop offset="50%" stop-color="#5cff9d"/>
      <stop offset="100%" stop-color="#48e0d2"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Code Bracket "<" (spaced out) -->
  <path d="M 12 9 L 4 18 L 12 27" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
  
  <!-- Right Code Bracket ">" (spaced out) -->
  <path d="M 52 9 L 60 18 L 52 27" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

  <!-- Centered Fuller Eye Eyelids -->
  <path d="M 18 18 C 22 6, 42 6, 46 18" stroke="#48e0d2" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)"/>
  <path d="M 18 18 C 22 30, 42 30, 46 18" stroke="#48e0d2" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)"/>

  <!-- Clean, Iconic Star Spark Pupil ✦ -->
  <path d="M 32 11 C 32 15.5, 34.5 18, 39 18 C 34.5 18, 32 20.5, 32 25 C 32 20.5, 29.5 18, 25 18 C 29.5 18, 32 15.5, 32 11 Z" 
        fill="url(#logoGrad)" 
        filter="url(#logoGlow)"/>
</svg>
