<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122036"/>
      <stop offset="50%" stop-color="#0c1320"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Lab Glow Gradients -->
    <linearGradient id="scryEyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48e0d2"/>
      <stop offset="50%" stop-color="#5cff9d"/>
      <stop offset="100%" stop-color="#48e0d2"/>
    </linearGradient>

    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cff9d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#48e0d2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#122036" stop-opacity="0"/>
    </radialGradient>

    <!-- Sci-Fantasy HUD Glow Filters -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Tile: Interstatus Lab 112 radius on 512 canvas -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0b0b12"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="url(#tileGrad)" stroke="#203453" stroke-width="3"/>

  <!-- Subtle Cyberpunk Lab Background Grid -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="#203453" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>

  <!-- Corner HUD Reticles (FF7R Sleek Lab Frame) -->
  <path d="M 72 120 L 72 72 L 120 72" stroke="#2e4d75" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 440 120 L 440 72 L 392 72" stroke="#2e4d75" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 72 392 L 72 440 L 120 440" stroke="#2e4d75" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 440 392 L 440 440 L 392 440" stroke="#2e4d75" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- ===== THE ALL-SEEING CODE EYE <  ( 👁️ )  > ===== -->

  <!-- Left Code Bracket "<" (clearly separated with breathing space) -->
  <path d="M 124 180 L 64 256 L 124 332" 
        stroke="url(#scryEyeGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#hudGlow)"/>

  <!-- Right Code Bracket ">" (clearly separated with breathing space) -->
  <path d="M 388 180 L 448 256 L 388 332" 
        stroke="url(#scryEyeGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#hudGlow)"/>

  <!-- Full, Centered Eye (Corners at 162 and 350, leaving clean ~38px gaps from brackets) -->
  <!-- Upper Eyelid Arch -->
  <path d="M 164 256 C 188 152, 324 152, 348 256" 
        stroke="#48e0d2" 
        stroke-width="12" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#hudGlow)"/>

  <!-- Lower Eyelid Arch -->
  <path d="M 164 256 C 188 360, 324 360, 348 256" 
        stroke="#48e0d2" 
        stroke-width="12" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#hudGlow)"/>

  <!-- Inner Eye Aura Glow -->
  <ellipse cx="256" cy="256" rx="84" ry="58" fill="url(#pupilGlow)" opacity="0.3"/>

  <!-- Outer Iris Ring (HUD Circular Reticle) -->
  <circle cx="256" cy="256" r="66" stroke="#48e0d2" stroke-width="3" stroke-dasharray="14,6" fill="none" opacity="0.75"/>
  <circle cx="256" cy="256" r="50" stroke="#5cff9d" stroke-width="2.5" fill="#070a10" opacity="0.95"/>

  <!-- Center All-Seeing Iris Core: Glowing Interstatus Lab ✦ Spark -->
  <path d="M 256 210 C 256 240, 272 256, 302 256 C 272 256, 256 272, 256 302 C 256 272, 240 256, 210 256 C 240 256, 256 240, 256 210 Z" 
        fill="url(#scryEyeGrad)" 
        filter="url(#intenseGlow)"/>

  <!-- Dual Specular Light Sparkles -->
  <circle cx="238" cy="238" r="5.5" fill="#ffffff" filter="url(#hudGlow)"/>
  <circle cx="274" cy="272" r="3" fill="#5cff9d"/>
</svg>
