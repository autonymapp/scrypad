<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScryPad ✦ Interstatus Lab</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070a10">
  <meta name="description" content="Sci-Fantasy WYSIWYG & HTML Code Editor by Interstatus Lab">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-[#070a10] text-[#e8eef8] select-none h-screen flex flex-col overflow-hidden">

  <!-- Interstatus Lab Top HUD Nav -->
  <header class="h-13 bg-[#0c1320] border-b border-[#203453] px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-4">
      <!-- App Brand & Eye Logo -->
      <div class="flex items-center gap-2.5">
        <img src="/logo.svg" alt="< 👁️ >" class="h-7 w-auto drop-shadow-[0_0_8px_rgba(72,224,210,0.5)]">
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5 leading-none">
            <span class="font-bold tracking-wider text-white text-lg font-['Rajdhani'] uppercase">Scry<span class="text-[#48e0d2]">Pad</span></span>
            <span class="text-[9px] font-['IBM_Plex_Mono'] uppercase tracking-widest bg-[#122036] border border-[#203453] text-[#5cff9d] px-1.5 py-0.5 rounded-sm">HUD v0.1</span>
          </div>
          <span class="text-[10px] text-[#8d9bb6] font-['IBM_Plex_Mono'] tracking-wide">Interstatus Lab</span>
        </div>
      </div>

      <div class="h-5 w-px bg-[#203453]"></div>

      <!-- File Deck -->
      <div class="flex items-center gap-2">
        <button id="btn-new" class="btn-hud btn-hud-ghost" title="Create New HTML File">
          <i data-lucide="file-plus" class="w-3.5 h-3.5 text-[#48e0d2]"></i>
          <span>New</span>
        </button>
        <button id="btn-open" class="btn-hud btn-hud-ghost" title="Open Local HTML File">
          <i data-lucide="folder-open" class="w-3.5 h-3.5 text-[#48e0d2]"></i>
          <span>Open</span>
        </button>
        <button id="btn-save" class="btn-hud btn-hud-primary" title="Save HTML (Ctrl+S)">
          <i data-lucide="save" class="w-3.5 h-3.5"></i>
          <span id="save-label">Save HTML</span>
        </button>
      </div>

      <!-- Active File Badge -->
      <div id="file-badge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-[#122036]/80 border border-[#203453] rounded-sm text-xs font-['IBM_Plex_Mono'] text-[#8d9bb6]">
        <i data-lucide="file-code" class="w-3 h-3 text-[#48e0d2]"></i>
        <span id="active-filename" class="text-[#e8eef8]">untitled.html</span>
        <span id="dirty-indicator" class="text-[#ffbf4d] hidden">✦</span>
      </div>
    </div>

    <!-- Right Controls: Libraries, Prettify, Layout Modes -->
    <div class="flex items-center gap-2.5">
      <!-- Add Library Button -->
      <button id="btn-library-toggle" class="btn-hud btn-hud-ghost" title="Inject Popular CDNs">
        <i data-lucide="book-copy" class="w-3.5 h-3.5 text-[#5cff9d]"></i>
        <span>Add Library</span>
      </button>

      <!-- Clean Code / Beautify -->
      <button id="btn-beautify" class="btn-hud btn-hud-ghost" title="Format & Indent HTML">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-[#48e0d2]"></i>
        <span>Clean Code</span>
      </button>

      <div class="h-5 w-px bg-[#203453]"></div>

      <!-- Mode Selector -->
      <div class="flex items-center bg-[#070a10] border border-[#203453] p-0.5 rounded">
        <button id="mode-split" class="px-2.5 py-1 text-xs font-['Rajdhani'] font-bold uppercase tracking-wider rounded bg-[#122036] text-[#48e0d2] border border-[#2e4d75]">Split</button>
        <button id="mode-code" class="px-2.5 py-1 text-xs font-['Rajdhani'] font-bold uppercase tracking-wider rounded text-[#8d9bb6] hover:text-[#e8eef8]">Code</button>
        <button id="mode-preview" class="px-2.5 py-1 text-xs font-['Rajdhani'] font-bold uppercase tracking-wider rounded text-[#8d9bb6] hover:text-[#e8eef8]">Preview</button>
      </div>
    </div>
  </header>

  <!-- Sub-Toolbar (Visual Tweaker Controls & Viewport) -->
  <div class="h-10 bg-[#0c1320]/90 border-b border-[#203453] px-4 flex items-center justify-between text-xs shrink-0 z-20">
    <div class="flex items-center gap-4">
      <!-- Visual Edit Toggle -->
      <label class="flex items-center gap-2 cursor-pointer bg-[#122036] hover:bg-[#162742] border border-[#203453] px-2.5 py-1 rounded transition text-xs font-medium">
        <input type="checkbox" id="toggle-visual-edit" class="accent-[#5cff9d] rounded cursor-pointer" checked />
        <span class="text-[#e8eef8] flex items-center gap-1.5">
          <i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5 text-[#5cff9d]"></i>
          <span>Click & Tweak Text</span>
        </span>
      </label>

      <!-- Quick Tweak Actions -->
      <div class="flex items-center gap-2 pl-3 border-l border-[#203453]">
        <span class="text-[11px] text-[#8d9bb6] font-['IBM_Plex_Mono'] uppercase">Text Format</span>
        <button id="btn-bold" class="px-2 py-0.5 bg-[#122036] hover:bg-[#1b2f4f] border border-[#203453] rounded text-[#e8eef8] font-bold" title="Toggle Bold">B</button>
        <button id="btn-italic" class="px-2 py-0.5 bg-[#122036] hover:bg-[#1b2f4f] border border-[#203453] rounded text-[#e8eef8] italic font-serif" title="Toggle Italic">I</button>
        
        <label class="flex items-center gap-1.5 px-2 py-0.5 bg-[#122036] hover:bg-[#1b2f4f] border border-[#203453] rounded cursor-pointer" title="Selection Color">
          <span class="text-[11px] text-[#8d9bb6]">Color</span>
          <input type="color" id="quick-color" value="#48e0d2" class="w-4 h-4 rounded cursor-pointer bg-transparent border-0 p-0">
        </label>
      </div>
    </div>

    <!-- Responsive Viewport Presets -->
    <div class="flex items-center gap-1.5 text-xs font-['IBM_Plex_Mono']">
      <span class="text-[11px] text-[#8d9bb6] uppercase mr-1">Viewport</span>
      <button class="viewport-btn px-2.5 py-0.5 rounded bg-[#122036] text-[#48e0d2] border border-[#2e4d75]" data-width="100%">
        <span class="hidden sm:inline">Desktop</span> 100%
      </button>
      <button class="viewport-btn px-2.5 py-0.5 rounded text-[#8d9bb6] hover:bg-[#122036] hover:text-[#e8eef8]" data-width="768px">
        <span class="hidden sm:inline">Tablet</span> 768px
      </button>
      <button class="viewport-btn px-2.5 py-0.5 rounded text-[#8d9bb6] hover:bg-[#122036] hover:text-[#e8eef8]" data-width="390px">
        <span class="hidden sm:inline">Mobile</span> 390px
      </button>
    </div>
  </div>

  <!-- Main Work Area -->
  <main id="workspace" class="flex-1 flex overflow-hidden relative">
    
    <!-- Left: Code Editor Pane -->
    <div id="code-pane-container" class="w-1/2 flex flex-col border-r border-[#203453] bg-[#080d15] relative">
      <div class="h-6 bg-[#0c1320] border-b border-[#203453] px-3 flex items-center justify-between text-[11px] font-['IBM_Plex_Mono'] text-[#8d9bb6] shrink-0">
        <span class="flex items-center gap-1.5 text-[#48e0d2]">
          <i data-lucide="code" class="w-3 h-3"></i>
          <span>HTML Source</span>
        </span>
        <span id="status-lines" class="text-[#8d9bb6]">Lines: 1</span>
      </div>
      <div id="code-mount" class="flex-1 h-full overflow-hidden"></div>
    </div>

    <!-- Right: Live Preview Pane -->
    <div id="preview-pane-container" class="w-1/2 flex flex-col bg-[#05070c] relative items-center justify-start overflow-hidden">
      <div class="w-full h-6 bg-[#0c1320] border-b border-[#203453] px-3 flex items-center justify-between text-[11px] font-['IBM_Plex_Mono'] text-[#8d9bb6] shrink-0">
        <span class="flex items-center gap-1.5 text-[#5cff9d]">
          <i data-lucide="eye" class="w-3 h-3"></i>
          <span>Live HUD Preview</span>
        </span>
        <span id="preview-mode-tag" class="text-[#48e0d2]">Direct Tweak Active</span>
      </div>

      <div id="preview-mount" class="w-full flex-1 flex justify-center items-stretch p-3 overflow-auto">
        <!-- Preview iframe is mounted here -->
      </div>
    </div>

  </main>

  <!-- ATB Gauge Line -->
  <div class="gauge-bar w-full">
    <div class="gauge-bar-fill"></div>
  </div>

  <!-- Bottom HUD Status Deck -->
  <footer class="h-6 bg-[#070a10] border-t border-[#203453] px-4 flex items-center justify-between text-[11px] font-['IBM_Plex_Mono'] text-[#8d9bb6] shrink-0">
    <div class="flex items-center gap-4">
      <span id="status-tagpath" class="text-[#48e0d2] truncate max-w-md">DOM ✦ body</span>
    </div>
    <div class="flex items-center gap-5">
      <span id="status-sync" class="text-[#5cff9d] flex items-center">
        <span class="inline-block w-2 h-2 rounded-full bg-[#5cff9d] mr-1.5"></span>HUD Synced
      </span>
      <span id="status-filesize">0 B</span>
      <span class="text-[#8d9bb6]/70 hidden md:inline">Sci-Fantasy Tools for Everyday Adventurers</span>
    </div>
  </footer>

  <!-- Library Injector Modal / Drawer -->
  <div id="modal-library" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-xl bg-[#0c1320] border border-[#203453] rounded-lg shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-3 border-b border-[#203453] flex items-center justify-between bg-[#122036]">
        <div class="flex items-center gap-2">
          <i data-lucide="book-copy" class="w-4 h-4 text-[#5cff9d]"></i>
          <h2 class="font-['Rajdhani'] font-bold text-base text-white uppercase tracking-wider">Quick Inject Code Libraries</h2>
        </div>
        <button id="btn-close-modal" class="text-[#8d9bb6] hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="library-list" class="p-4 space-y-2.5 max-h-[60vh] overflow-y-auto">
        <!-- Rendered by main.ts -->
      </div>
      <div class="px-5 py-3 bg-[#070a10] border-t border-[#203453] flex justify-between items-center text-xs text-[#8d9bb6]">
        <span>Tags are cleanly injected into your &lt;head&gt;</span>
        <button id="btn-modal-done" class="btn-hud btn-hud-ghost">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
