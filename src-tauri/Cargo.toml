[package]
name = "scrypad"
version = "0.1.0"
description = "ScryPad: Sci-Fantasy WYSIWYG & HTML Code Editor by Interstatus Lab"
authors = ["Graves Ghostly"]
edition = "2021"

[lib]
name = "scrypad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
